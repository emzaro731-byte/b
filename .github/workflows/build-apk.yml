name: Build Veylola Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android platform
        run: flutter create --platforms=android .

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Authenticate with Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not configured."
            exit 1
          fi
          firebase projects:list --token "$FIREBASE_TOKEN" >/dev/null

      - name: Configure FlutterFire for Veylola
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutterfire configure --project=emma-f716b --platforms=android --yes

      - name: Install dependencies
        run: flutter pub get

      - name: Deploy Firebase Cloud Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions --project emma-f716b --token "$FIREBASE_TOKEN"

      - name: Remove old Firebase AI provider secrets
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          for SECRET in GROQ_API_KEY KIE_API_KEY KIE_API_URL; do
            firebase functions:secrets:destroy "$SECRET" --project emma-f716b --token "$FIREBASE_TOKEN" --force || true
          done

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylola-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


