name: veylola_ai
description: Veylola AI - a powerful Flutter AI app powered by Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  speech_to_text: ^7.4.0
  http: ^1.5.0
  provider: ^6.1.5+1
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
