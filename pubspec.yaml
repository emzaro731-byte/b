name: veylola_ai
description: Veylola AI - a powerful Flutter AI app powered by Firebase and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_storage: ^13.0.0
  firebase_analytics: ^12.5.0
  firebase_app_check: ^0.4.7
  firebase_messaging: ^16.4.0
  supabase_flutter: ^2.10.2
  google_sign_in: ^7.1.1
  image_picker: ^1.2.0
  http: ^1.5.0
  provider: ^6.1.5+1
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
